<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
  <sly data-sly-call="${clientlib.all @ categories='spark.weather'}"></sly>

<div class="weather-widget" data-city="${properties.city}" data-unit="${properties.unit}">
    <div class="weather-loader">
        <div class="spinner"></div>
        <span>Loading weather...</span>
    </div>
    <div class="weather-content hidden">
        <div class="weather-location"></div>
        <div class="weather-info">
            <img class="weather-icon" alt="Weather Icon" />
            <div class="weather-temp"></div>
        </div>
        <div class="weather-description"></div>
    </div>
</div>
